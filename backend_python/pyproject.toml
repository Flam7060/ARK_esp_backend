[project]
name = "ark-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[all]>=0.141.1",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.0",
    "apscheduler>=3.10.4",
    "pyjwt[crypto]>=2.9.0",
    "alembic>=1.13.3",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
