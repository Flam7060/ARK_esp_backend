asyncapi: 3.0.0
info:
  title: ark_relay live sighting channel
  version: 2.0.0
  description: >
    WebSocket-протокол обмена ESP-сайтингами между клиентами одной группы
    (sharing group — реальные тиммейты, не игровой ARK-трайб) на одном
    игровом сервере. Ручная спека — в отличие от OpenAPI на backend_python
    (генерируется из кода FastAPI на каждый запрос /openapi.json), тут нет
    автогена из Go: правишь internal/protocol/message.go — правь и этот
    файл тем же PR-ом, иначе спека молча разъедется с реальным протоколом.
    См. также docker-compose.yml/backend_python/docs/telemetry-api-v1.md §7.3.

    v2: раздача переведена с игрового tribe_id на пару (sharing group,
    server_ip) — см. §7 обновлённого telemetry-api-v1.md. JWT сократился до
    одного claim (account_id); категории расширены структурами/турелями;
    Entity/Inbound получили новые поля для этого и для дедуп-потока в
    Postgres (внутренний механизм, самого потока в этом канале не видно).

    v3: group_id ушёл из хендшейка. Группа больше не параметр, который
    указывает клиент — relay резолвит её сам по account_id (одна активная
    группа на аккаунт, account.active_group_id в backend_python,
    зеркалится в Redis ark:account:{account_id}:active_group). Клиент,
    у которого нет активной группы, получает 403 при хендшейке.

servers:
  relay:
    host: 'localhost:8081'
    protocol: wss
    description: ark_relay WebSocket endpoint

defaultContentType: application/json

channels:
  sighting:
    address: /v1/relay/ws
    description: >
      Один WS-коннект на клиента. Authorization: Bearer <jwt> заголовком
      (нативный Go-клиент) или ?token=<jwt> query-параметром (браузер —
      WebSocket API не даёт ставить заголовки на handshake). Handshake
      дополнительно требует query-параметр server_ip — обязателен, коннект
      без него отклоняется 400 ещё до проверки токена. Группа клиентом не
      передаётся: relay резолвит текущую активную группу account_id (из
      JWT/API-key) сам через Redis ark:account:{account_id}:active_group,
      зеркало backend_python's account.active_group_id. Нет активной
      группы — 403. Кик/выход/удаление группы или смена активной группы
      рвёт уже открытое соединение почти сразу через отдельный Redis
      Pub/Sub-канал (не часть этого WS-канала).
    parameters:
      server_ip:
        description: >-
          Адрес игрового сервера клиента ("ip:port"), не название карты —
          два разных сервера могут крутить одну и ту же карту.
    messages:
      clientSighting:
        $ref: '#/components/messages/sighting'
      clientPing:
        $ref: '#/components/messages/ping'
      relayedSighting:
        $ref: '#/components/messages/sighting'
      relayPong:
        $ref: '#/components/messages/pong'

operations:
  sendSighting:
    action: send
    channel:
      $ref: '#/channels/sighting'
    summary: Клиент отправляет пачку сущностей, которые видит прямо сейчас через ESP.
    messages:
      - $ref: '#/channels/sighting/messages/clientSighting'
  receiveSighting:
    action: receive
    channel:
      $ref: '#/channels/sighting'
    summary: >-
      Клиент получает сайтинг, отправленный другим клиентом с той же
      активной группой и server_ip.
    messages:
      - $ref: '#/channels/sighting/messages/relayedSighting'

components:
  messages:
    sighting:
      name: sighting
      title: Пачка сайтингов за один тик
      payload:
        $ref: '#/components/schemas/SightingPayload'
    ping:
      name: ping
      title: Keepalive от клиента
      payload:
        type: object
        properties:
          type:
            type: string
            const: ping
    pong:
      name: pong
      title: Keepalive-ответ
      payload:
        type: object
        properties:
          type:
            type: string
            const: pong

  schemas:
    SightingPayload:
      type: object
      required: [type, seq]
      properties:
        type:
          type: string
          const: sighting
        seq:
          type: integer
          format: uint64
          description: >
            Монотонный счётчик тиков клиента-отправителя. Пачка с seq <=
            последнему принятому отбрасывается целиком (устарела) — не
            переупорядочивается внутри.
        reporter_character_id:
          type: string
          description: >-
            Только во входящем сообщении. Игровой id персонажа отправителя
            прямо сейчас — не аутентификационная identity (это account_id
            из JWT), а игровой факт: один аккаунт может иметь персонажей на
            нескольких серверах/трайбах одновременно.
        vanished:
          type: array
          maxItems: 500
          items:
            type: string
          description: >-
            Только во входящем сообщении. Ключи (Entity.key) целей, которые
            клиент раньше видел и с этим батчем больше не видит — явный
            сигнал "пропало", сильнее молчания/протухания TTL, потому что
            означает "кто-то реально пересканировал это место и не нашёл",
            а не просто "перестал смотреть".
        reported_by:
          type: string
          format: uuid
          description: Только в исходящем (relay -> подписчики) сообщении — account_id отправителя.
        relayed_at:
          type: string
          format: date-time
          description: Только в исходящем сообщении — момент ретрансляции (UTC, RFC3339Nano).
        entities:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Entity'

    Entity:
      type: object
      required: [key, cat, team, x, y, z]
      properties:
        v:
          type: integer
          format: uint8
          description: >-
            Версия схемы этого объекта. Отсутствует (0) трактуется как
            версия 1 для обратной совместимости с продюсерами до появления
            этого поля.
        key:
          type: string
          description: >-
            Составной идентификатор — "{cat}:{label}:{team}" для dino,
            "{cat}:{stable_id}:{team}" для player (client_id-стабильный
            linked_player_data_id вместо ника, т.к. ники могут совпадать).
            Не Addr из памяти игры (FR-6). Для structure/turret это поле
            может прийти пустым — relay сам вычисляет его как
            "{cat}:{contentHash}" (класс + округлённые до 300 единиц
            координаты) до валидации сообщения; отдельного HTTP-пайплайна
            для структур в эту версию протокола больше не выделено.
          example: 'player:8842091337:42'
        cat:
          type: string
          enum: [player, dino, turret, structure]
        team:
          type: integer
          format: int32
        label:
          type: string
          description: >-
            Обязателен для player/dino. Для structure/turret не имеет
            смысла (нет игрового отображаемого имени) — вместо него
            обязателен class.
        class:
          type: string
          description: >-
            Обязателен для structure/turret (идентичность через class +
            округлённые координаты — FR-5 в telemetry-api-v1.md). Опционален
            для player/dino.
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
        tribe:
          type: string
          description: Optional. In-game tribe name of the sighted actor, when the client tracks it.
        status:
          type: string
          enum: [awake, sleeping, knocked_out, dead]
          description: Optional. Live ESP state, distinct from cat (what it is) -- omitted when the producer doesn't track it (dinos, older clients).
        health:
          type: number
          format: double
          description: Optional. Current health, when the producer tracks it for this cat.
        max_health:
          type: number
          format: double
        held_item:
          type: string
          description: Optional. Name of the item currently equipped/held, for players and dinos.
        turret:
          $ref: '#/components/schemas/TurretInfo'
          description: Обязателен, когда cat == turret; отсутствует иначе.

    TurretInfo:
      type: object
      description: >-
        Зеркало kopt::share::TurretInfo (клиент arkmultitool,
        include/kopt/share.hpp) — источник контракта для этой схемы.
      properties:
        ammo:
          type: integer
          format: int32
          description: Optional — отсутствует, если клиент не смог прочитать боезапас (не то же самое, что 0).
        range:
          type: integer
          format: uint8
        targeting:
          type: integer
          format: uint8
        warning:
          type: integer
          format: uint8
        powered:
          type: boolean
        active:
          type: boolean
        targeting_actor:
          type: boolean
