asyncapi: 3.0.0
info:
  title: ark_relay live sighting channel
  version: 2.0.0
  description: >
    QUIC-протокол обмена ESP-сайтингами внутри sharing group (не
    ARK-трайб) на одном сервере. Ручная спека — правишь
    internal/protocol/message.go, правь и её тем же PR-ом. См. также
    backend_python/docs/telemetry-api-v1.md §7.3.

    v2: раздача по (sharing group, server_ip) вместо tribe_id; JWT — один
    claim account_id; добавлены структуры/турели.

    v3: group_id ушёл из хендшейка — relay резолвит активную группу сам по
    account_id (account.active_group_id, зеркало в Redis). Нет активной
    группы — 403.

    v4: reporter_character_id/reporter_x/y/z теперь и в исходящем
    сообщении (были только во входящем). Entity.stable_id — включает
    публикацию player в ark:stream:player_sighting (раньше не публиковался).

    v5: WebSocket-транспорт удалён, QUIC остался единственным — спека
    описывает его. JSON-контракт сообщений не менялся: он с самого начала
    был общим для обоих транспортов. Изменилось обрамление: вместо
    HTTP-апгрейда и WS-фреймов — один bidi-стрим с 4-байтным префиксом
    длины и явным handshake-фреймом вместо заголовков/query.

    v6: Entity.steam_id — настоящий SteamID64 (offset найден вживую в
    2026-09), platform_id в ark:stream:player_sighting предпочитает его
    stable_id, когда задан.

servers:
  relay:
    host: 'localhost:8443'
    protocol: quic
    description: >
      Bare QUIC (не HTTP/3), UDP. ALPN 'ark-quic-v1', TLS 1.3 обязателен —
      QUIC без него не бывает, plaintext-варианта нет. Клиент пинит
      сертификат релея (deploy/deploy.sh генерит долгоживущий self-signed);
      без RELAY_TLS_CERT_FILE релей поднимает эфемерный self-signed на
      процесс — годится только для локальной разработки.

defaultContentType: application/json

channels:
  sighting:
    address: null
    description: >
      Одно QUIC-соединение на клиента, в нём ровно один bidi-стрим (лишние
      стримы игнорируются). Каждое сообщение — 4-байтный big-endian префикс
      длины плюс JSON-тело; лимит тела 64 KiB, handshake-фрейм отдельно
      ограничен 4096 байтами.

      Первым фреймом клиент шлёт handshake {token, server_ip}, релей
      отвечает {ok} либо {ok:false, error} и закрывает стрим. Группа не
      передаётся — релей резолвит активную группу сам по account_id из
      токена; нет активной группы или аккаунт не член её — отказ на
      handshake. Кик/смена активной группы рвёт уже открытое соединение
      через отдельный Redis Pub/Sub. После ok идут sighting/ping/pong в
      обе стороны.
    messages:
      clientHandshake:
        $ref: '#/components/messages/handshakeRequest'
      relayHandshakeAck:
        $ref: '#/components/messages/handshakeResponse'
      clientSighting:
        $ref: '#/components/messages/sighting'
      clientPing:
        $ref: '#/components/messages/ping'
      relayedSighting:
        $ref: '#/components/messages/sighting'
      relayPong:
        $ref: '#/components/messages/pong'

operations:
  sendHandshake:
    action: send
    channel:
      $ref: '#/channels/sighting'
    summary: Первый фрейм в стриме — до ответа релея любой другой трафик отбрасывается.
    messages:
      - $ref: '#/channels/sighting/messages/clientHandshake'
  receiveHandshakeAck:
    action: receive
    channel:
      $ref: '#/channels/sighting'
    summary: Ответ релея на handshake; при ok=false стрим закрывается сразу после него.
    messages:
      - $ref: '#/channels/sighting/messages/relayHandshakeAck'
  sendSighting:
    action: send
    channel:
      $ref: '#/channels/sighting'
    summary: Клиент отправляет пачку сущностей, которые видит прямо сейчас через ESP.
    messages:
      - $ref: '#/channels/sighting/messages/clientSighting'
  receiveSighting:
    action: receive
    channel:
      $ref: '#/channels/sighting'
    summary: >-
      Клиент получает сайтинг, отправленный другим клиентом с той же
      активной группой и server_ip.
    messages:
      - $ref: '#/channels/sighting/messages/relayedSighting'

components:
  messages:
    handshakeRequest:
      name: handshakeRequest
      title: Первый фрейм стрима — аутентификация
      payload:
        $ref: '#/components/schemas/HandshakeRequest'
    handshakeResponse:
      name: handshakeResponse
      title: Ответ релея на handshake
      payload:
        $ref: '#/components/schemas/HandshakeResponse'
    sighting:
      name: sighting
      title: Пачка сайтингов за один тик
      payload:
        $ref: '#/components/schemas/SightingPayload'
    ping:
      name: ping
      title: Keepalive от клиента
      payload:
        type: object
        properties:
          type:
            type: string
            const: ping
    pong:
      name: pong
      title: Keepalive-ответ
      payload:
        type: object
        properties:
          type:
            type: string
            const: pong

  schemas:
    HandshakeRequest:
      type: object
      required: [token, server_ip]
      description: Фрейм ограничен 4096 байтами (quicserver.maxHandshakeBytes).
      properties:
        token:
          type: string
          description: >-
            RS256 JWT от backend_python либо self-service api_key —
            релей принимает обе формы (internal/tokenauth: JWT проверяется
            офлайн, api_key резолвится через Redis).
        server_ip:
          type: string
          description: "ip:port игрового сервера."
      additionalProperties: false

    HandshakeResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
          description: Человекочитаемая причина отказа, не машинный код. Только при ok=false.
      additionalProperties: false

    SightingPayload:
      type: object
      required: [type, seq]
      properties:
        type:
          type: string
          const: sighting
        seq:
          type: integer
          format: uint64
          description: Монотонный счётчик тиков клиента. Пачка с seq <= последней принятой отбрасывается.
        reporter_character_id:
          type: string
          description: Вход и выход. Игровой id персонажа отправителя (не account_id из JWT).
        reporter_x:
          type: number
          format: double
          description: Вход и выход. Позиция отправителя на момент батча. 0 — неизвестна.
        reporter_y:
          type: number
          format: double
        reporter_z:
          type: number
          format: double
        vanished:
          type: array
          maxItems: 500
          items:
            type: string
          description: Только вход. Ключи (Entity.key) целей, которые клиент видел раньше и не видит в этом батче.
        reported_by:
          type: string
          format: uuid
          description: Только в исходящем (relay -> подписчики) сообщении — account_id отправителя.
        relayed_at:
          type: string
          format: date-time
          description: Только в исходящем сообщении — момент ретрансляции (UTC, RFC3339Nano).
        entities:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Entity'

    Entity:
      type: object
      required: [key, cat, team, x, y, z]
      properties:
        v:
          type: integer
          format: uint8
          description: >-
            Версия схемы этого объекта. Отсутствует (0) трактуется как
            версия 1 для обратной совместимости с продюсерами до появления
            этого поля.
        key:
          type: string
          description: >-
            "{cat}:{label}:{team}" для dino, "{cat}:{stable_id}:{team}" для
            player. Не Addr из памяти игры. Для structure/turret может
            прийти пустым — relay вычисляет сам как "{cat}:{contentHash}".
          example: 'player:8842091337:42'
        cat:
          type: string
          enum: [player, dino, turret, structure]
        team:
          type: integer
          format: int32
        label:
          type: string
          description: Обязателен для player/dino. Для structure/turret — class вместо него.
        class:
          type: string
          description: Обязателен для structure/turret. Опционален для player/dino.
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
        tribe:
          type: string
          description: Optional. In-game tribe name of the sighted actor, when the client tracks it.
        status:
          type: string
          enum: [awake, sleeping, knocked_out, dead]
          description: Optional. Live ESP state, distinct from cat (what it is) -- omitted when the producer doesn't track it (dinos, older clients).
        health:
          type: number
          format: double
          description: Optional. Current health, when the producer tracks it for this cat.
        max_health:
          type: number
          format: double
        held_item:
          type: string
          description: Optional. Name of the item currently equipped/held, for players and dinos.
        turret:
          $ref: '#/components/schemas/TurretInfo'
          description: Обязателен, когда cat == turret; отсутствует иначе.
        stable_id:
          type: integer
          format: uint64
          description: linked_player_data_id, только для cat == player. Не Steam id. Без него player не публикуется в ark:stream:player_sighting.
        steam_id:
          type: integer
          format: uint64
          description: >-
            Настоящий SteamID64, только для cat == player. Может отсутствовать
            даже у игрока с непустым stable_id — 0, если у клиента-отправителя
            в момент захвата уже не было PlayerState цели (владелец только
            что отключился). Если задан, становится platform_id в
            ark:stream:player_sighting вместо stable_id.

    TurretInfo:
      type: object
      description: >-
        Зеркало kopt::share::TurretInfo (клиент arkmultitool,
        include/kopt/share.hpp) — источник контракта для этой схемы.
      properties:
        ammo:
          type: integer
          format: int32
          description: Optional — отсутствует, если клиент не смог прочитать боезапас (не то же самое, что 0).
        range:
          type: integer
          format: uint8
        targeting:
          type: integer
          format: uint8
        warning:
          type: integer
          format: uint8
        powered:
          type: boolean
        active:
          type: boolean
        targeting_actor:
          type: boolean
